[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkle-coder"
version = "0.6.0"
description = "SPARKLE CODER: a personal coding agent powered by NVIDIA Nemotron."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sparkle-coder = "sparkle_coder.cli:main"

[project.gui-scripts]
sparkle-coder-app = "sparkle_coder.web:main"

[tool.setuptools.packages.find]
include = ["sparkle_coder*"]

[tool.setuptools.package-data]
sparkle_coder = ["ui/*"]

[project.urls]
Repository = "https://github.com/pexxoraa/SPARKLE-CODER"
