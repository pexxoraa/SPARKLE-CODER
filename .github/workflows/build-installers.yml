name: Build installers

# Builds a one-file SPARKLE CODER executable for Windows, macOS, and Linux
# on GitHub's own hosted runners (PyInstaller can't cross-compile, so this
# has to run natively on each OS — that's what this workflow is for).
#
# Trigger it by pushing a version tag:
#   git tag v1.0 && git push origin v1.0
# ...or run it by hand from the Actions tab (workflow_dispatch). Either way,
# finished builds appear as downloadable artifacts on the run's summary
# page, and pushing a tag also attaches them to a GitHub Release so you have
# one stable link to send your 30-50 testers.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SparkleCoder.exe
            asset_name: SparkleCoder-Windows.exe
          - os: macos-latest
            artifact_name: SparkleCoder
            asset_name: SparkleCoder-macOS
          - os: ubuntu-latest
            artifact_name: SparkleCoder
            asset_name: SparkleCoder-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: pyinstaller packaging/sparkle-coder.spec

      - name: Rename output
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact_name }}" "out/${{ matrix.asset_name }}"
          chmod +x "out/${{ matrix.asset_name }}" || true

      - name: Verify executable, website pairing, approval, repair and downloads
        run: python scripts/smoke_packaged.py "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact folders
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Automated build. Unsigned executables — see packaging/README.md
            for the security-warning click-throughs testers will see on
            first launch (Windows SmartScreen / macOS Gatekeeper).
